name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Проверка качества кода
    runs-on: ubuntu-latest

    steps:
      - name: Клонируем код
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Устанавливаем зависимости
        run: npm ci

      - name: Запускаем ESLint
        run: npm run lint

      - name: Запускаем Prettier
        run: npm run format:check

  tests:
    name: Тесты
    runs-on: ubuntu-latest

    steps:
      - name: Клонируем код
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Устанавливаем зависимости
        run: npm ci

      - name: Запускаем тесты
        run: npm run test:ci

  build:
    name: Сборка
    runs-on: ubuntu-latest

    steps:
      - name: Клонируем код
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Устанавливаем зависимости
        run: npm ci

      - name: Собираем проект
        run: npm run build

  deploy:
    name: Деплой на GitHub Pages
    runs-on: ubuntu-latest
    needs: [quality, tests, build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Клонируем код
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Устанавливаем зависимости
        run: npm ci

      - name: Собираем проект
        run: npm run build

      - name: Деплоим на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
