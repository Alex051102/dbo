<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ДБО — Система дистанционного банковского обслуживания</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .app { max-width: 1200px; margin: 0 auto; }
    .header { background: #0a1e3c; color: white; padding: 24px 30px; border-radius: 12px; margin-bottom: 24px; }
    .header h1 { font-size: 24px; font-weight: 600; }
    .header p { color: #8ba0c7; margin-top: 6px; font-size: 14px; }
    .module { background: white; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .module h3 { color: #1a3a5c; margin-bottom: 16px; font-size: 18px; }
    input, select { padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; width: 100%; max-width: 300px; }
    button { padding: 10px 20px; background: #0a1e3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1a3a5c; }
    button:disabled { background: #b0b8c4; cursor: default; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 12px 10px; background: #f7f9fc; border-bottom: 2px solid #e1e4e8; }
    td { padding: 12px 10px; border-bottom: 1px solid #e1e4e8; }
    .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; display: inline-block; }
    .status-success { background: #d4edda; color: #155724; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-failed { background: #f8d7da; color: #721c24; }
    .status-loading { background: #cce5ff; color: #004085; }
    .label { font-weight: 500; color: #24292f; display: block; margin-bottom: 4px; }
    .mt-10 { margin-top: 10px; }
    .ml-15 { margin-left: 15px; }
    .flex { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
